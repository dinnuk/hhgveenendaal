<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHG Veenendaal – Declaraties</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            font-size: 13px;
            background-color: #f5f3f2;
            color: #4c4e4f;
        }

        #header {
            background-color: #004b58;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #header h1 {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }

        #header .subtitle {
            color: #92aab0;
            font-size: 12px;
            margin-left: 10px;
        }

        .header-left { display: flex; align-items: baseline; gap: 8px; }

        #header button {
            background: transparent;
            border: 1px solid #63858e;
            color: #92aab0;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        #header button:hover { background: #035765; color: #fff; }

        #main {
            max-width: 1100px;
            margin: 28px auto;
            padding: 0 20px;
        }

        /* Breadcrumb */
        #breadcrumb {
            font-size: 12px;
            color: #92aab0;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #breadcrumb a {
            color: #035765;
            text-decoration: none;
            cursor: pointer;
        }

        #breadcrumb a:hover { text-decoration: underline; }

        /* Club grid */
        #club-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .club-card {
            background: #fff;
            border: 1px solid #dfe5e6;
            border-radius: 6px;
            box-shadow: 0 0 4px rgba(0,0,0,0.08);
            padding: 20px;
            cursor: pointer;
            transition: box-shadow 0.15s, border-color 0.15s;
        }

        .club-card:hover {
            box-shadow: 0 2px 10px rgba(0,75,88,0.15);
            border-color: #63858e;
        }

        .club-card h2 {
            color: #004b58;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .club-stats {
            display: flex;
            gap: 20px;
        }

        .stat-label {
            font-size: 11px;
            color: #92aab0;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #004b58;
        }

        .stat-value.amount { color: #035765; }

        /* Club detail */
        #club-detail { display: none; }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .detail-header h2 {
            color: #004b58;
            font-size: 18px;
        }

        .btn-primary {
            background-color: #004b58;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 9px 18px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-primary:hover { background-color: #035765; }

        /* Table */
        .table-wrap {
            background: #fff;
            border: 1px solid #dfe5e6;
            border-radius: 6px;
            box-shadow: 0 0 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background-color: #004b58;
            color: #fff;
            font-size: 12px;
            font-weight: normal;
            text-align: left;
            padding: 10px 14px;
        }

        tbody tr {
            border-bottom: 1px solid #e4e8e9;
        }

        tbody tr:last-child { border-bottom: none; }

        tbody tr:hover { background-color: #faf9f8; }

        tbody td {
            padding: 10px 14px;
            font-size: 12px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        .badge-ingediend { background: #e8f4f0; color: #035765; }
        .badge-goedgekeurd { background: #e6f4e6; color: #2a7a2a; }
        .badge-afgekeurd { background: #fde8e8; color: #c00; }

        .link-bonnetje {
            color: #035765;
            text-decoration: none;
            font-size: 11px;
        }

        .link-bonnetje:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #92aab0;
        }

        /* Modal */
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        #modal-overlay.open { display: flex; }

        #modal {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            width: 480px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            background: #004b58;
            color: #fff;
            padding: 16px 20px;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 { font-size: 15px; }

        .modal-close {
            background: none;
            border: none;
            color: #92aab0;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover { color: #fff; }

        .modal-body { padding: 20px; }

        .form-row {
            margin-bottom: 14px;
        }

        .form-row label {
            display: block;
            font-size: 12px;
            color: #4c4e4f;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-row input,
        .form-row select,
        .form-row textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #dfe5e6;
            border-radius: 4px;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }

        .form-row textarea { resize: vertical; min-height: 70px; }

        .form-row input:focus,
        .form-row select:focus,
        .form-row textarea:focus {
            outline: none;
            border-color: #63858e;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid #dfe5e6;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            background: #fff;
            color: #4c4e4f;
            border: 1px solid #dfe5e6;
            border-radius: 4px;
            padding: 9px 18px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-cancel:hover { background: #f5f3f2; }

        /* Loading / error */
        .loading { color: #92aab0; padding: 20px; text-align: center; }
        .error-msg { color: #c00; font-size: 12px; margin-top: 8px; }
        .success-msg { color: #2a7a2a; font-size: 12px; margin-top: 8px; }

        #form-status { min-height: 20px; }
    </style>
</head>
<body>

<div id="header">
    <div class="header-left">
        <h1>HHG Veenendaal</h1>
        <span class="subtitle">Declaraties Jeugdwerk</span>
    </div>
    <button onclick="logout()">Uitloggen</button>
</div>

<div id="main">
    <!-- Overview -->
    <div id="overview">
        <div id="breadcrumb">Overzicht</div>
        <div id="club-grid">
            <div class="loading">Laden...</div>
        </div>
    </div>

    <!-- Club detail -->
    <div id="club-detail">
        <div id="breadcrumb-detail" class="detail-header">
            <div id="breadcrumb2">
                <span id="bc-overview"></span>
            </div>
            <button class="btn-primary" onclick="openModal()">+ Nieuwe declaratie</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Naam</th>
                        <th>Datum</th>
                        <th>Bedrag</th>
                        <th>Categorie</th>
                        <th>Omschrijving</th>
                        <th>Bonnetje</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="declarations-tbody">
                    <tr><td colspan="7" class="loading">Laden...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modal-overlay">
    <div id="modal">
        <div class="modal-header">
            <h3>Nieuwe declaratie</h3>
            <button class="modal-close" onclick="closeModal()">&#x2715;</button>
        </div>
        <div class="modal-body">
            <form id="decl-form" onsubmit="submitDeclaration(event)">
                <div class="form-row">
                    <label for="f-naam">Naam leidinggevende *</label>
                    <input type="text" id="f-naam" name="naam" required>
                </div>
                <div class="form-row">
                    <label for="f-club">Club *</label>
                    <select id="f-club" name="club" required>
                        <option value="">Selecteer club...</option>
                        <option>Meisjes groep 5 &amp; 6</option>
                        <option>Jongens groep 5 &amp; 6</option>
                        <option>Meisjes groep 7 &amp; 8</option>
                        <option>Jongens groep 7 &amp; 8</option>
                        <option>Tienerclub</option>
                        <option>JV Brea</option>
                    </select>
                </div>
                <div class="form-row-2">
                    <div class="form-row" style="margin-bottom:0">
                        <label for="f-bedrag">Bedrag (€) *</label>
                        <input type="number" id="f-bedrag" name="bedrag" step="0.01" min="0" required>
                    </div>
                    <div class="form-row" style="margin-bottom:0">
                        <label for="f-datum">Datum *</label>
                        <input type="date" id="f-datum" name="datum" required>
                    </div>
                </div>
                <div class="form-row">
                    <label for="f-categorie">Categorie *</label>
                    <select id="f-categorie" name="categorie" required>
                        <option value="">Selecteer categorie...</option>
                        <option>Materiaal</option>
                        <option>Eten</option>
                        <option>Uitje</option>
                        <option>Overig</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="f-omschrijving">Omschrijving *</label>
                    <textarea id="f-omschrijving" name="omschrijving" required></textarea>
                </div>
                <div class="form-row">
                    <label for="f-bonnetje">Bonnetje (foto/PDF)</label>
                    <input type="file" id="f-bonnetje" name="bonnetje" accept="image/*,.pdf">
                </div>
                <div id="form-status"></div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" type="button" onclick="closeModal()">Annuleren</button>
            <button class="btn-primary" type="submit" form="decl-form" id="submit-btn">Indienen</button>
        </div>
    </div>
</div>

<script>
const CLUBS = [
    "Meisjes groep 5 & 6",
    "Jongens groep 5 & 6",
    "Meisjes groep 7 & 8",
    "Jongens groep 7 & 8",
    "Tienerclub",
    "JV Brea"
];

let allDeclarations = [];
let currentClub = null;

async function loadOverview() {
    try {
        const res = await fetch("/api/declarations");
        const data = await res.json();
        allDeclarations = data.records || [];
        renderClubGrid();
    } catch {
        document.getElementById("club-grid").innerHTML = '<p class="error-msg">Fout bij laden. Probeer opnieuw.</p>';
    }
}

function renderClubGrid() {
    const grid = document.getElementById("club-grid");
    grid.innerHTML = CLUBS.map(club => {
        const records = allDeclarations.filter(r => r.fields.Club === club);
        const total = records.reduce((sum, r) => sum + (r.fields.Bedrag || 0), 0);
        return `
            <div class="club-card" onclick="showClub('${club.replace(/'/g, "\\'")}')">
                <h2>${club}</h2>
                <div class="club-stats">
                    <div>
                        <div class="stat-label">Declaraties</div>
                        <div class="stat-value">${records.length}</div>
                    </div>
                    <div>
                        <div class="stat-label">Totaal</div>
                        <div class="stat-value amount">€ ${total.toFixed(2).replace(".", ",")}</div>
                    </div>
                </div>
            </div>`;
    }).join("");
}

function showClub(club) {
    currentClub = club;
    document.getElementById("overview").style.display = "none";
    document.getElementById("club-detail").style.display = "block";

    document.getElementById("bc-overview").innerHTML =
        `<span id="breadcrumb2"><a onclick="showOverview()">Overzicht</a> › ${club}</span>`;

    const records = allDeclarations.filter(r => r.fields.Club === club);
    renderDeclarations(records);

    // Pre-select club in form
    document.getElementById("f-club").value = club;
}

function showOverview() {
    currentClub = null;
    document.getElementById("club-detail").style.display = "none";
    document.getElementById("overview").style.display = "block";
    renderClubGrid();
}

function renderDeclarations(records) {
    const tbody = document.getElementById("declarations-tbody");
    if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Nog geen declaraties voor deze club.</td></tr>';
        return;
    }

    const sorted = [...records].sort((a, b) => (b.fields.Datum || "").localeCompare(a.fields.Datum || ""));

    tbody.innerHTML = sorted.map(r => {
        const f = r.fields;
        const datum = f.Datum ? new Date(f.Datum).toLocaleDateString("nl-NL") : "–";
        const bedrag = f.Bedrag != null ? `€ ${f.Bedrag.toFixed(2).replace(".", ",")}` : "–";
        const badgeClass = { Ingediend: "badge-ingediend", Goedgekeurd: "badge-goedgekeurd", Afgekeurd: "badge-afgekeurd" }[f.Status] || "badge-ingediend";
        const bonnetje = f.Bonnetje && f.Bonnetje.length > 0
            ? `<a class="link-bonnetje" href="${f.Bonnetje[0].url}" target="_blank">Bekijken</a>`
            : "–";

        return `<tr>
            <td>${f.Naam || "–"}</td>
            <td>${datum}</td>
            <td>${bedrag}</td>
            <td>${f.Categorie || "–"}</td>
            <td>${f.Omschrijving || "–"}</td>
            <td>${bonnetje}</td>
            <td><span class="badge ${badgeClass}">${f.Status || "Ingediend"}</span></td>
        </tr>`;
    }).join("");
}

function openModal() {
    document.getElementById("modal-overlay").classList.add("open");
    document.getElementById("form-status").innerHTML = "";
    document.getElementById("decl-form").reset();
    if (currentClub) document.getElementById("f-club").value = currentClub;
    // Default to today
    document.getElementById("f-datum").value = new Date().toISOString().split("T")[0];
}

function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");
}

async function submitDeclaration(e) {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const status = document.getElementById("form-status");
    btn.disabled = true;
    btn.textContent = "Bezig...";
    status.innerHTML = "";

    try {
        const formData = new FormData(document.getElementById("decl-form"));
        const res = await fetch("/api/declarations", { method: "POST", body: formData });
        const result = await res.json();

        if (res.ok) {
            status.innerHTML = '<span class="success-msg">Declaratie ingediend!</span>';
            // Reload data
            const all = await fetch("/api/declarations");
            const data = await all.json();
            allDeclarations = data.records || [];

            setTimeout(() => {
                closeModal();
                if (currentClub) {
                    const records = allDeclarations.filter(r => r.fields.Club === currentClub);
                    renderDeclarations(records);
                } else {
                    renderClubGrid();
                }
            }, 800);
        } else {
            status.innerHTML = `<span class="error-msg">Fout: ${result.error || "Onbekende fout"}</span>`;
        }
    } catch {
        status.innerHTML = '<span class="error-msg">Verbindingsfout. Probeer opnieuw.</span>';
    } finally {
        btn.disabled = false;
        btn.textContent = "Indienen";
    }
}

function logout() {
    window.location.href = "/api/logout";
}

// Close modal on overlay click
document.getElementById("modal-overlay").addEventListener("click", e => {
    if (e.target === document.getElementById("modal-overlay")) closeModal();
});

loadOverview();
</script>
</body>
</html>
